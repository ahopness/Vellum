name = "vellum"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_VERSION = "24"
PUBLIC_APP_URL = "https://vellum.lucasangelo.dev/"
RESEND_FROM_EMAIL = "Vellum <noreply@vellum.lucasangelo.dev>"

[[d1_databases]]
binding = "DB"
database_name = "vellum-db"
database_id = "b0ac02f2-01ae-4eec-9b85-8c6f7bf7a9a0"

[[r2_buckets]]
binding = "R2"
bucket_name = "vellum-storage"
